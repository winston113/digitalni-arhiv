# Zasebna namestitev. Nastavitve so v datoteki .env (glejte .env.example).
name: arhiv

services:
  arhiv:
    image: ghcr.io/winston113/digitalni-arhiv:1.2.0
    build: .
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: "3000"
    ports:
      - "${BIND:-127.0.0.1:3000}:3000"
    volumes:
      - ${DATA:-podatki}:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  podatki:
