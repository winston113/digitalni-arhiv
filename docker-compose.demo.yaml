# Javna predstavitvena različica: ločen vsebnik, ločeni podatki, omejeni viri.
# Zagon: docker compose -f docker-compose.demo.yaml --env-file .env.demo up -d --build
name: arhiv-demo

services:
  arhiv:
    image: ghcr.io/winston113/digitalni-arhiv:1.4.0
    build: .
    user: "${DEMO_PUID:-1000}:${DEMO_PGID:-1000}"
    restart: unless-stopped
    environment:
      BASE_URL: ${DEMO_BASE_URL:?Nastavite DEMO_BASE_URL v .env.demo}
      TRUST_PROXY: ${DEMO_TRUST_PROXY:-true}
      REGISTRATION: ${DEMO_REGISTRATION:-true}
      STORAGE_LIMIT_MB: ${DEMO_STORAGE_LIMIT_MB:-500}
      MAX_FILE_MB: ${DEMO_MAX_FILE_MB:-25}
      OCR: ${DEMO_OCR:-true}
      OCR_WORKERS: ${DEMO_OCR_WORKERS:-auto}
      OIDC_ISSUER: ${DEMO_OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${DEMO_OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${DEMO_OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${DEMO_OIDC_NAME:-Zitadel}
      DATA_DIR: /data
      PORT: "3000"
    ports:
      - "${DEMO_BIND:-127.0.0.1:3100}:3000"
    volumes:
      - ${DEMO_DATA:-podatki}:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1
    pids_limit: 100

volumes:
  podatki:

# Stalno ime omrežnega mostu omogoča pravilo požarnega zidu, ki vsebniku prepreči nove povezave navzven.
networks:
  default:
    driver_opts:
      com.docker.network.bridge.name: br-arhivdemo
