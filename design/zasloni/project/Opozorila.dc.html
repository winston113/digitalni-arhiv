<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<title>Opozorila</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="zasloni.css">
<link rel="stylesheet" href="ds/digitalniarhivpogodb/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div class="screen" data-theme="{{ dataTheme }}">
<div class="layout">
<dc-import name="Navigacija" vrsta="stranska" aktivna="opozorila" telefon="{{ telefon }}" hint-size="232px,100%"></dc-import>
<div class="main">
<dc-import name="Glava" prijavljen="{{ da }}" tema="{{ tema }}" on-tema="{{ setTema }}" telefon="{{ telefon }}" hint-size="100%,60px"></dc-import>
<main class="content">
<div class="page-head"><h1>Opozorila</h1></div>
<p class="muted">Pogodbe, ki jih je treba podaljšati ali prekiniti. Izberite pogodbo in uredite njen rok.</p>
<section class="panel"><div class="panel-head"><h2>Rok je minil</h2></div><dc-import name="Seznam" pogodbe="{{ minuli }}" telefon="{{ telefon }}" hint-size="100%,115px"></dc-import></section>
<section class="panel"><div class="panel-head"><h2>Rok se bliža</h2></div><dc-import name="Seznam" pogodbe="{{ blizajo }}" telefon="{{ telefon }}" hint-size="100%,185px"></dc-import></section>
</main>
</div>
</div>
<div class="bottom"><dc-import name="Navigacija" vrsta="spodnja" aktivna="opozorila" telefon="{{ telefon }}" hint-size="100%,64px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["system","light","dark"],"default":"system"},"telefon":{"editor":null},"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const tema = this.state?.tema ?? this.props.tema ?? 'system';
    return {
      tema, dataTheme: tema === 'dark' ? 'dark' : 'light', setTema: (t) => this.setState({ tema: t }),
      telefon: !!this.props.telefon, da: true,
      minuli: [['Zavarovanje odgovornosti', 'Zavarovalnica Breza, d. d.', 'Zavarovanje', '15. 11. 2026', 'rok je minil', 'potekla']],
      blizajo: [
        ['Vzdrževanje računalniške opreme', 'Sistemi Koren, d. o. o.', 'Storitve', '16. 12. 2026', 'čez 23 dni', 'kmalu'],
        ['Licenca za računovodski program', 'Programska hiša Hrast, d. o. o.', 'Licence in naročnine', '21. 12. 2026', 'čez 28 dni', 'kmalu']
      ]
    };
  }
}
</script>
</body>
</html>
