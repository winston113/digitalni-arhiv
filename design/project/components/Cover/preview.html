<!doctype html>
<html lang="sl"><head><meta charset="utf-8"><style>
body{margin:0;background:var(--surface);position:relative;width:960px;height:280px;overflow:hidden}
svg{position:absolute;inset:0}
.pri{fill:var(--primary)}.dark{fill:var(--primary-hover)}.tint{fill:var(--primary-tint)}.ink{fill:var(--ink)}.warn{fill:var(--warning)}
rect.cell,.cells rect{rx:var(--radius-sm)}
.name{position:absolute;left:32px;bottom:72px;font:600 64px/.95 var(--font-sans);letter-spacing:-.02em;color:var(--ink);white-space:nowrap}
.tag{position:absolute;left:34px;bottom:32px;max-width:440px;font:400 14px/20px var(--font-sans);color:var(--ink-muted)}
</style></head><body>
<svg width="960" height="280" viewBox="0 0 960 280" aria-hidden="true">

 vzorec: koledar 7 x 4, ker sistem varuje roke pogodb; en dan je rok za ukrepanje
 merila: korak 8 in 32 (space-2, space-6), vogali radius-sm -->
