services:
  arhiv:
    image: ghcr.io/winston113/digitalni-arhiv:latest
    build: .
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    ports:
      - "${BIND:-127.0.0.1:3000}:3000"
    env_file: .env
    volumes:
      - podatki:/data

volumes:
  podatki:
